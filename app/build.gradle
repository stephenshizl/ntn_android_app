plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.youyou.ntn_bt'
    // Use the installed stable Android 16 SDK. The demo does not need the 36.1
    // minor platform and avoiding it keeps clean-machine builds deterministic.
    compileSdk 36

    defaultConfig {
        applicationId "com.youyou.ntn_bt"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
